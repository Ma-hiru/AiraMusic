name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CI: true
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: packages/store/go.mod
          cache-dependency-path: packages/store/go.sum

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/wasm-pack
            ~/.cargo/registry
            ~/.cargo/git
            packages/wasm/target
            packages/native/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('packages/wasm/Cargo.lock', 'packages/native/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Lint
        run: yarn lint:check

      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1; then
            cargo install wasm-pack --version 0.15.0 --locked
          fi

      - name: Build native binaries
        run: yarn build:bin

      - name: Type check
        run: yarn check

      - name: Test
        run: yarn test

      - name: Build desktop bundles
        run: |
          yarn build:ui
          yarn build:app
