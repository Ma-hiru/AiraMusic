name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARGS=(
            release create "$GITHUB_REF_NAME"
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --draft
            --generate-notes
            --title "AiraMusic ${GITHUB_REF_NAME#v}"
          )

          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            ARGS+=(--prerelease)
          fi

          gh "${ARGS[@]}"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare-release

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest

          - name: Windows ARM64
            os: windows-11-arm

          - name: Linux x64
            os: ubuntu-22.04

          - name: Linux ARM64
            os: ubuntu-24.04-arm
            container: ubuntu:22.04

          - name: macOS ARM64
            os: macos-latest

          - name: macOS x64
            os: macos-15-intel

    runs-on: ${{ matrix.os }}
    # ARM64 宿主是 24.04，使用 22.04 用户空间保持相同的 glibc 构建基线。
    container: ${{ matrix.container }}

    steps:
      - name: Install container prerequisites
        if: matrix.container
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install --no-install-recommends -y \
            ca-certificates curl git sudo gh build-essential cmake \
            pkg-config libssl-dev libglib2.0-0 xz-utils unzip

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: packages/store/go.mod
          cache-dependency-path: packages/store/go.sum

      - name: Download Go dependencies
        working-directory: packages/store
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if go mod download; then
              exit 0
            fi
            echo "Go dependency download failed (attempt $attempt/3)."
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 5
          done

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y rpm libopenjp2-tools

      - name: Build
        run: yarn build

      - name: Upload Windows release assets
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            dist/*.exe \
            dist/*.msi \
            --clobber

      - name: Upload Linux release assets
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            dist/*.AppImage \
            dist/*.deb \
            dist/*.rpm \
            dist/*.tar.gz \
            --clobber

      - name: Upload macOS release assets
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            dist/*.dmg \
            --clobber

  publish-release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
