[package]
name = "agent"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
async-openai = { version = "0.41", features = ["chat-completion"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
tokio = { version = "1.5", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
async-stream = "0.3"
futures = "0.3"
backon = "1.6.0"
reqwest = { version = "0.13.4", features = ["json"] }
chrono = "0.4.45"
async-trait = "0.1.92"
axum = "0.8"
tiktoken-rs = "0.12.0"
once_cell = "1.21.4"
rmcp = { version = "3", features = ["client", "server", "macros", "transport-child-process", "transport-io", "transport-streamable-http-client-reqwest"] }
http = "1"
http-body-util = "0.1"
subtle = "2.6"
tower = { version = "0.5", features = ["util"] }
tokio-stream = { version = "0.1", features = ["sync"] }

[profile.dev]
debug = false
panic = "abort"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
debug-assertions = false
overflow-checks = false
panic = "abort"
