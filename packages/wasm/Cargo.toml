[package]
name = "wasm"
version = "1.0.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }
image = "0.25"
tsify = "0.5.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
js-sys = "0.3.8"
regex = "1"
rustfft = "6"
csscolorparser = "0.7"
web-sys = { version = "0.3", features = [
    "console",
    "HtmlCanvasElement",
    "WebGlRenderingContext",
    "WebGlProgram",
    "WebGlShader",
    "WebGlBuffer",
    "WebGlUniformLocation"
] }
anyhow = "1.0.100"

# 只在 wasm 目标下使用（lib.rs 的 `init` 里 `set_once`）
# 标成 target 依赖以免宿主端 clippy 误报 unused dependency
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
debug-assertions = false
overflow-checks = false
panic = "abort"
